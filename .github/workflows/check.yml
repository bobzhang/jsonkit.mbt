name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        moonbit: [latest, pre-release]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - name: moon check (warnings are errors)
        run: moon check --deny-warn --target all
      # Stable and prerelease disagree on trailing commas. The requested
      # canonical source format follows prerelease; both channels still
      # check and test all targets below.
      - name: moon fmt (prerelease canonical format)
        if: matrix.moonbit == 'pre-release'
        run: moon fmt --check
      - name: Run tests
        run: moon test --target all
